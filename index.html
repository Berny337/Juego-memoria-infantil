<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Memoria Infantil</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #8ed8ff, #dff7ff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

h1 {
  color: #ffffff;
  font-size: 32px;
  margin: 15px 0 5px;
  text-shadow: 2px 2px 4px #579bc0;
}

.subtitle {
  color: #ffffff;
  font-size: 18px;
  margin-bottom: 15px;
}

.info {
  display: flex;
  justify-content: space-between;
  background: white;
  border-radius: 18px;
  padding: 12px 18px;
  margin-bottom: 18px;
  box-shadow: 0 4px 10px rgba(0,0,0,.15);
  font-weight: bold;
  color: #444;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  max-width: 430px;
  margin: auto;
}

.card {
  aspect-ratio: 1;
  border: none;
  border-radius: 18px;
  background: #ffcb45;
  box-shadow: 0 5px 8px rgba(0,0,0,.2);
  font-size: 38px;
  cursor: pointer;
  transition: transform .2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card:active {
  transform: scale(.92);
}

.card.flipped,
.card.matched {
  background: white;
}

.card.matched {
  box-shadow: 0 0 0 4px #67d36b;
}

.message {
  margin-top: 20px;
  color: white;
  font-size: 22px;
  font-weight: bold;
  min-height: 30px;
}

button.restart {
  margin-top: 15px;
  padding: 13px 25px;
  border: none;
  border-radius: 25px;
  background: #ff6b6b;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 7px rgba(0,0,0,.2);
}

.win {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.win-box {
  background: white;
  border-radius: 30px;
  padding: 35px 25px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

.win-box h2 {
  color: #ff9f1c;
  font-size: 32px;
}

.win-box p {
  font-size: 20px;
  color: #444;
}

.win-box button {
  border: none;
  border-radius: 25px;
  padding: 14px 30px;
  background: #5bc85b;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

@media (max-width: 380px) {
  .game {
    padding: 12px;
  }

  h1 {
    font-size: 27px;
  }

  .board {
    gap: 7px;
  }

  .card {
    font-size: 30px;
    border-radius: 14px;
  }
}
</style>
</head>

<body>

<div class="game">

  <h1>🧠 Juego de Memoria</h1>
  <div class="subtitle">¡Encuentra todos los pares!</div>

  <div class="info">
    <div>⭐ Parejas: <span id="pairs">0</span>/8</div>
    <div>🎯 Movimientos: <span id="moves
